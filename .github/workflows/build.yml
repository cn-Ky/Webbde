name: Webbde derle
on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux bağımlılıkları
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri icon src-tauri/icons/icon.png
      - run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: webbde-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**/*
