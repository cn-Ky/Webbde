name: Webbde sürüm yayınla

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest        # Apple Silicon
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-15-intel      # Intel Mac
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - platform: windows-latest
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux bağımlılıkları
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Rust kurulumu
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tauri CLI kurulumu
        run: npm install -g @tauri-apps/cli@2

      - name: Eksik ikonları üret (icon.png -> ico/icns/png)
        run: tauri icon src-tauri/icons/icon.png

      - name: Updater anahtarı ve repo adresini yerleştir
        shell: bash
        env:
          PUBKEY: ${{ secrets.UPDATER_PUBKEY }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os
          p = "src-tauri/tauri.conf.json"
          c = json.load(open(p, encoding="utf-8"))
          u = c["plugins"]["updater"]
          u["pubkey"] = "".join(os.environ["PUBKEY"].split())
          u["endpoints"] = ["https://github.com/" + os.environ["REPO"] + "/releases/latest/download/latest.json"]
          json.dump(c, open(p, "w", encoding="utf-8"), indent=2, ensure_ascii=False)
          PY

      - name: Derle ve release oluştur
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: tauri
          tagName: v__VERSION__
          releaseName: "Webbde v__VERSION__"
          releaseBody: "Kurulum dosyaları aşağıdadır."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
